<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yapılacaklar Listesi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="kart">
    <h1>Yapılacaklar Listesi</h1>

    <form id="gorev-formu" class="form">
      <input
        type="text"
        id="gorev-girdisi"
        placeholder="Yeni bir görev yaz..."
        autocomplete="off"
        required
      >
      <button type="submit">Ekle</button>
    </form>

    <ul id="gorev-listesi" class="liste"></ul>

    <p id="bos-mesaj" class="bos-mesaj">Henüz görev yok. Yukarıdan bir tane ekle!</p>
    <p id="sayac" class="sayac"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
